<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You can be exhibited here as well</title>
    <style>
        :root {
            --bg-dark: #120e0c;
            --accent-gold: #d4a359;
            --accent-glow: #ffe8b3;
            --text-color: #f0e6d2;
            --border-color: #5c4636;
        }

        body {
            font-family: 'Georgia', 'Garamond', 'Batang', serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-gold);
            padding: 15px;
            width: 100%;
            max-width: 960px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        .audio-player {
            background: #2a1f18;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .tab-btn {
            background: rgba(42, 32, 26, 0.9);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            cursor: pointer;
            font-size: 1.05rem;
            border-radius: 6px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: #120e0c;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212, 163, 89, 0.4);
        }

        .content-area {
            width: 100%;
            max-width: 960px;
            min-height: 550px;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            border: 2px solid var(--border-color);
        }

        /* 1. 박물관 천장 명화 배경 */
        #museum-view {
            background: linear-gradient(rgba(18, 14, 12, 0.55), rgba(18, 14, 12, 0.75)),
                        url('museum.jpg');
            background-size: cover;
            background-position: center;
        }

        /* 2. 개인 서재/사무실 지구본 배경 */
        #office-view {
            background: linear-gradient(rgba(10, 8, 12, 0.6), rgba(10, 8, 12, 0.8)),
                        url('personal office.jpg');
            background-size: cover;
            background-position: center;
        }

        .section-header {
            border-bottom: 1px solid var(--accent-gold);
            padding: 10px 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.65);
            border-radius: 6px;
        }

        .section-header h3 {
            margin: 0;
            color: var(--accent-glow);
            font-size: 1.4rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .museum-stand {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 100%);
            border: 2px solid rgba(212, 163, 89, 0.8);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s;
        }

        .museum-stand:hover {
            transform: translateY(-5px);
            border-color: var(--accent-glow);
        }

        .office-frame {
            background: rgba(26, 20, 18, 0.95);
            border: 8px solid #5c3a21;
            outline: 2px solid #2e1c0f;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stand-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #0d0b0a;
            border-radius: 4px;
            border: 1px solid rgba(212, 163, 89, 0.4);
            box-sizing: border-box;
        }

        .stand-caption {
            margin-top: 12px;
            text-align: center;
            width: 100%;
        }

        .stand-title {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1.05rem;
            margin-bottom: 4px;
        }

        .stand-subtitle {
            font-size: 0.8rem;
            color: #a8998c;
        }

        .plaque {
            background: #2b2017;
            border: 1px solid var(--accent-gold);
            padding: 4px 8px;
            font-size: 0.75rem;
            color: #d9c2a7;
            margin-top: 8px;
            border-radius: 2px;
            display: inline-block;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-card {
            background: #1e1815;
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            width: 92%;
            max-width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
        }

        .pop-date-badge {
            text-align: center;
            font-size: 0.85rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .popup-title {
            color: var(--accent-glow);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .creature-quote {
            font-size: 0.95rem;
            color: #d1c0aa;
            font-style: italic;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 6px;
        }

        .creature-img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            background-color: #0b0908;
            border-radius: 8px;
            border: 1px solid var(--accent-gold);
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .creature-info {
            font-size: 0.88rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(212, 163, 89, 0.2);
            margin-bottom: 20px;
        }

        .info-row {
            margin-bottom: 8px;
        }

        .info-label {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #2a201a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: var(--accent-gold);
            color: #120e0c;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        .modal-card::-webkit-scrollbar { width: 6px; }
        .modal-card::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h1>You can be exhibited here as well</h1>
        <div class="audio-player">
            🎵 관람 BGM 설정: 
            <input type="file" id="audio-file" accept="audio/*">
            <audio id="bgm" loop></audio>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('museum')">🏛️ 박물관 전시관</button>
        <button class="tab-btn" onclick="switchTab('office')">🔒 개인 사무실</button>
    </div>

    <div id="museum-view" class="content-area">
        <div class="section-header">
            <h3>🏛️ 중앙 고생물 전시관</h3>
        </div>
        <div id="museum-grid" class="grid-container"></div>
    </div>

    <div id="office-view" class="content-area hidden">
        <div class="section-header">
            <h3>🔒 개인 사무실</h3>
        </div>
        <div id="office-grid" class="grid-container"></div>
    </div>

    <div id="daily-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div id="pop-date" class="pop-date-badge">[ TODAY ]</div>
            <h2 id="pop-header" class="popup-title">알림</h2>
            <div id="pop-quote" class="creature-quote">"대사"</div>
            <img id="pop-img" class="creature-img" src="" alt="생물 사진/일러스트">
            
            <div id="pop-info" class="creature-info"></div>

            <div class="choices">
                <button class="choice-btn" onclick="makeChoice('museum')">🏛️ 1. 박물관 중앙 전시관에 정식 전시한다</button>
                <button class="choice-btn" onclick="makeChoice('office')">🔒 2. 개인 사무실에 몰래 소장한다</button>
                <button class="choice-btn" onclick="makeChoice('return')">📦 3. 인근 다른 연구 기관으로 반송한다</button>
            </div>
        </div>
    </div>

    <script>
        const headerTitles = [
            '환영합니다!',
            '새로운 방문자',
            '나를 만난 적 있나요?',
            '멸종은 불가피합니다',
            '잊혀진 존재가 문을 두드립니다',
            '또 하나의 기억이 도착했습니다'
        ];

        /* 검증된 정확한 생물 사진 및 복원도 URL 적용 */
        const creatureDB = [
            {
                id: 'dodo',
                type: '🐦 신생대 조류',
                name: '도도새 (Dodo)',
                quote: '"낙원에서는 날 필요가 없었죠."',
                era: '신생대 홀로세 (1681년경 인간에 의해 멸종)',
                size: '키 약 1m / 체중 약 10~17kg',
                trait: '모리셔스 섬에 고립되어 살면서 천적이 없어 비행 능력을 잃어버린 거대한 비둘기과의 새.',
                detail: '사람을 전혀 경계하지 않고 호기심이 많아 다가왔기 때문에 선원들에게 쉽게 포획됨.',
                reason: '모리셔스 섬에 들어온 인간의 무분별한 포획과 외래종(돼지, 쥐, 개)의 알 포식으로 멸종.',
                img: 'dodo.webp'
            },
            {
                id: 'cooksonia',
                type: '🌱 고생대 식물',
                name: '쿡소니아 (Cooksonia)',
                quote: '"물 밖으로 나가는 첫 걸음은 두려운 법이죠."',
                era: '고생대 실루리아기~데본기 초 (약 4억 2천만 년 전)',
                size: '높이 약 3cm ~ 6cm',
                trait: '지구 역사상 최초로 육상에 적응한 관다발 식물 중 하나. 줄기 끝 포자낭으로 번식함.',
                detail: '바다 속에서만 생명이 존재하던 지구에 대변혁을 일으킨 선구자적 육상 식물.',
                reason: '기후 변화와 더 크게 진화한 후속 육상 식물들과의 빛/영양분 경쟁에서 밀려나 멸종.',
                img: 'cooksonia.webp'
            },
            {
                id: 'trilobite',
                type: '🦐 고생대 절지동물',
                name: '삼엽충 (Trilobite)',
                quote: '"바다 밑바닥이 그립기도 합니다만, 이 진열장도 제법 안락하군요."',
                era: '고생대 캄브리아기 ~ 페름기 말 (약 5억 2천만 년 전~2억 5천만 년 전)',
                size: '길이 1cm ~ 70cm',
                trait: '몸이 세 개의 세로 축으로 나뉘어 삼엽충이라 불림. 탄산칼슘 외골격을 가짐.',
                detail: '약 3억 년 동안 지구 바다를 지배했으며 2만 종이 넘는 다양한 형태가 존재했음.',
                reason: '페름기 말, 해수온 상승과 산소 부족을 초래한 지구 역사상 최대 규모의 대멸종으로 전멸.',
                img: 'trilobite.jpg'
            },
            {
                id: 'tyrannosaurus',
                type: '🦖 중생대 파충류 (공룡)',
                name: '티라노사우루스 렉스 (T. rex)',
                quote: '"유카탄에서의 뜨거운 추억이 떠오르는군요."',
                era: '중생대 백악기 후기 (약 6,800만 년 전~6,600만 년 전)',
                size: '몸길이 약 12m ~ 13m / 체중 약 6~9톤',
                trait: '압도적인 크기의 두개골과 바나나 크기만 한 톱날 이빨을 가진 최상위 포식자.',
                detail: '뛰어난 시력, 입체 음향 청력, 강력한 후각을 모두 갖춘 완벽한 포식 공룡.',
                reason: '멕시코 유카탄 반도에 떨어진 거대 소행성 충돌(K-Pg 대멸종)로 인한 생태계 붕괴로 멸종.',
                img: 'tyrammosaurus.webp'
            },
            {
                id: 'mamooth',
                type: '🐘 신생대 포유류',
                name: '털매머드 (Woolly Mammoth)',
                quote: '"이곳은 꽤 따뜻하네요?"',
                era: '신생대 플라이스토세~홀로세 (약 40만 년 전~4,000년 전)',
                size: '어깨 높이 약 2.7m ~ 3.4m / 체중 약 4~6톤',
                trait: '혹한을 견디기 위한 빽빽한 털과 두꺼운 지방층, 길게 휜 엄니를 가짐.',
                detail: '거대한 엄니는 눈을 치워 풀을 찾아내거나 포식자를 위협하는 용도로 쓰임.',
                reason: '빙하기 종료 후 툰드라 초원 감소 및 인류의 과도한 사냥이 복합 작용하여 멸종.',
                img: 'mammoth.webp'
            }
        ];

        const choiceResponses = {
            office: ['대범하군요.', '이건 비밀입니다.', '역사 하나를 은밀히 담았습니다.'],
            return: ['그게 최선일지도 모릅니다.', '행운을 빕니다.', '누군가는 이 결정을 깊이 아쉬워할 것입니다.', '당돌한 인간이군!']
        };

        let currentCreature = null;
        let museumList = [];
        let officeList = [];

        window.onload = function() {
            triggerTestVisit();
            renderMuseum();
            renderOffice();
        };

        function triggerTestVisit() {
            const randomIndex = Math.floor(Math.random() * creatureDB.length);
            currentCreature = creatureDB[randomIndex];
            showPopup(currentCreature);
        }

        function showPopup(creature) {
            const randomHeader = headerTitles[Math.floor(Math.random() * headerTitles.length)];
            const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('pop-date').innerText = `[ ${todayStr} 의 발견 ]`;
            document.getElementById('pop-header').innerText = randomHeader;
            document.getElementById('pop-quote').innerText = creature.quote;
            document.getElementById('pop-img').src = creature.img;
            
            document.getElementById('pop-info').innerHTML = `
                <div class="info-row"><span class="info-label">🏷️ 명칭:</span> ${creature.name} (${creature.type})</div>
                <div class="info-row"><span class="info-label">⏳ 생존 연대:</span> ${creature.era}</div>
                <div class="info-row"><span class="info-label">📏 신체 규모:</span> ${creature.size}</div>
                <div class="info-row"><span class="info-label">🧬 주요 특징:</span> ${creature.trait}</div>
                <div class="info-row"><span class="info-label">📖 상세 정보:</span> ${creature.detail}</div>
                <div class="info-row" style="margin-bottom:0;"><span class="info-label" style="color:#e28181;">☠️ 멸종 원인:</span> ${creature.reason}</div>
            `;

            document.getElementById('daily-modal').classList.remove('hidden');
        }

        function makeChoice(action) {
            if (action === 'museum') {
                museumList.push(currentCreature);
                alert(`[${currentCreature.name}]이(가) 중앙 박물관 진열대에 배치되었습니다.`);
            } else if (action === 'office') {
                officeList.push(currentCreature);
                const msg = choiceResponses.office[Math.floor(Math.random() * choiceResponses.office.length)];
                alert(`"${msg}"\n\n[${currentCreature.name}]을(를) 개인 사무실에 소장했습니다.`);
            } else if (action === 'return') {
                const msg = choiceResponses.return[Math.floor(Math.random() * choiceResponses.return.length)];
                alert(`"${msg}"\n\n[${currentCreature.name}]을(를) 다른 연구기관으로 반송했습니다.`);
            }

            document.getElementById('daily-modal').classList.add('hidden');
            renderMuseum();
            renderOffice();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('museum-view').classList.add('hidden');
            document.getElementById('office-view').classList.add('hidden');

            if (tab === 'museum') {
                document.getElementById('museum-view').classList.remove('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('office-view').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        function renderMuseum() {
            const grid = document.getElementById('museum-grid');
            grid.innerHTML = '';

            if (museumList.length === 0) {
                grid.innerHTML = '<div style="color:#a39284; grid-column: 1/-1; text-align:center; padding: 40px;">전시관이 아직 비어있습니다.</div>';
                return;
            }

            museumList.forEach(item => {
                grid.innerHTML += `
                    <div class="museum-stand">
                        <img class="stand-img" src="${item.img}" alt="${item.name}">
                        <div class="stand-caption">
                            <div class="stand-title">${item.name}</div>
                            <div class="stand-subtitle">${item.type}</div>
                            <div class="plaque">${item.era}</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderOffice() {
            const grid = document.getElementById('office-grid');
            grid.innerHTML = '';

            if (officeList.length === 0) {
                grid.innerHTML = '<div style="color:#8c7a6b; grid-column: 1/-1; text-align:center; padding: 40px;">개인 사무실에 아직 수집품이 없습니다.</div>';
                return;
            }

            officeList.forEach(item => {
                grid.innerHTML += `
                    <div class="office-frame">
                        <img class="stand-img" src="${item.img}" alt="${item.name}">
                        <div class="stand-caption">
                            <div class="stand-title" style="color:#e28181;">${item.name}</div>
                            <div class="stand-subtitle" style="color:#b59b9b;">🔒 개인 소장품</div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('audio-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const audio = document.getElementById('bgm');
                audio.src = URL.createObjectURL(file);
                audio.play();
            }
        });
    </script>
</body>
</html>
