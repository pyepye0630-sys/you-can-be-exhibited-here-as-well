<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You can be exhibited here as well</title>
    <style>
        :root {
            --bg-dark: #120e0c;
            --accent-gold: #d4a359;
            --accent-glow: #ffe8b3;
            --text-color: #f0e6d2;
            --panel-bg: rgba(28, 22, 19, 0.85);
            --border-color: #5c4636;
        }

        body {
            font-family: 'Georgia', 'Garamond', 'Batang', serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent-gold);
            padding-bottom: 15px;
            width: 100%;
            max-width: 960px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        h1 {
            font-size: 2.2rem;
            color: var(--accent-gold);
            letter-spacing: 3px;
            margin: 0 0 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        .audio-player {
            background: #2a1f18;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .tab-btn {
            background: #2a201a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 28px;
            cursor: pointer;
            font-size: 1.05rem;
            border-radius: 6px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: #120e0c;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212, 163, 89, 0.4);
        }

        .content-area {
            width: 100%;
            max-width: 960px;
            min-height: 500px;
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
            border: 2px solid var(--border-color);
        }

        /* 박물관 배경 */
        #museum-view {
            background: linear-gradient(rgba(18, 14, 12, 0.75), rgba(18, 14, 12, 0.85)),
                        url('https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        /* 개인 사무실 배경 */
        #office-view {
            background: linear-gradient(rgba(10, 8, 12, 0.85), rgba(10, 8, 12, 0.92)),
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        .section-header {
            border-bottom: 1px solid var(--accent-gold);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .section-header h3 {
            margin: 0;
            color: var(--accent-glow);
            font-size: 1.4rem;
        }

        .section-header p {
            margin: 5px 0 0 0;
            color: #b3a296;
            font-size: 0.85rem;
        }

        /* 전시 그리드 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        /* 박물관 유리 진열대 프레임 */
        .museum-stand {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.01) 100%);
            border: 2px solid rgba(212, 163, 89, 0.6);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: transform 0.3s;
        }

        .museum-stand:hover {
            transform: translateY(-5px);
            border-color: var(--accent-glow);
        }

        /* 사무실 액자 프레임 */
        .office-frame {
            background: #1a1412;
            border: 8px solid #5c3a21;
            outline: 2px solid #2e1c0f;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 5px 10px 20px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .stand-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(0,0,0,0.8);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .stand-caption {
            margin-top: 12px;
            text-align: center;
            width: 100%;
        }

        .stand-title {
            color: var(--accent-gold);
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .stand-subtitle {
            font-size: 0.75rem;
            color: #a8998c;
        }

        .plaque {
            background: #2b2017;
            border: 1px solid var(--accent-gold);
            padding: 4px 8px;
            font-size: 0.7rem;
            color: #d9c2a7;
            margin-top: 8px;
            border-radius: 2px;
            display: inline-block;
        }

        /* 팝업 스타일 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-card {
            background: #1e1815;
            border: 2px solid var(--accent-gold);
            border-radius: 12px;
            width: 92%;
            max-width: 580px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.95);
            position: relative;
        }

        .pop-date-badge {
            text-align: center;
            font-size: 0.8rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .popup-title {
            color: var(--accent-glow);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .creature-quote {
            font-size: 0.95rem;
            color: #d1c0aa;
            font-style: italic;
            text-align: center;
            margin-bottom: 15px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .creature-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        .creature-info {
            font-size: 0.88rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(212, 163, 89, 0.2);
            margin-bottom: 20px;
        }

        .info-row {
            margin-bottom: 8px;
        }

        .info-label {
            color: var(--accent-gold);
            font-weight: bold;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: #2a201a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .choice-btn:hover {
            background: var(--accent-gold);
            color: #120e0c;
            font-weight: bold;
        }

        .hidden { display: none !important; }

        /* 스크롤바 디자인 */
        .modal-card::-webkit-scrollbar { width: 6px; }
        .modal-card::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    </style>
</head>
<body>

    <header>
        <h1>You can be exhibited here as well</h1>
        <div class="audio-player">
            🎵 박물관 관람 BGM 설정: 
            <input type="file" id="audio-file" accept="audio/*">
            <audio id="bgm" loop></audio>
        </div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('museum')">🏛️ 박물관 전시관</button>
        <button class="tab-btn" onclick="switchTab('office')">🔒 비밀 개인 사무실</button>
    </div>

    <div id="museum-view" class="content-area">
        <div class="section-header">
            <h3>🏛️ 중앙 고생물 전시관</h3>
            <p>시대를 뛰어넘어 보존된 기이하고 아름다운 멸종 생물들의 공간입니다.</p>
        </div>
        <div id="museum-grid" class="grid-container"></div>
    </div>

    <div id="office-view" class="content-area hidden">
        <div class="section-header">
            <h3>🔒 관장 전용 비밀 사무실</h3>
            <p>어질러진 서류와 먼지 쌓인 진열대 사이, 오직 당신만의 은밀한 수집품들입니다.</p>
        </div>
        <div id="office-grid" class="grid-container"></div>
    </div>

    <!-- 매일 일일 생물 팝업 -->
    <div id="daily-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div id="pop-date" class="pop-date-badge">[ TODAY ]</div>
            <h2 id="pop-header" class="popup-title">알림</h2>
            <div id="pop-quote" class="creature-quote">"대사"</div>
            <img id="pop-img" class="creature-img" src="" alt="생물 사진">
            
            <div id="pop-info" class="creature-info">
                <!-- 상세 정보 -->
            </div>

            <div class="choices">
                <button class="choice-btn" onclick="makeChoice('museum')">🏛️ 1. 박물관 중앙 전시관에 정식 전시한다</button>
                <button class="choice-btn" onclick="makeChoice('office')">🔒 2. 개인 사무실 캐비닛에 몰래 소장한다</button>
                <button class="choice-btn" onclick="makeChoice('return')">📦 3. 인근 다른 연구 기관으로 반송한다</button>
            </div>
        </div>
    </div>

    <script>
        // 상단 랜덤 타이틀
        const headerTitles = [
            '환영합니다!',
            '새로운 방문자',
            '나를 만난 적 있나요?',
            '멸종은 불가피합니다',
            '잊혀진 존재가 문을 두드립니다',
            '또 하나의 기억이 도착했습니다'

        // 다양한 식물, 공룡, 조류, 포유류, 어류, 절지동물 등 풍부한 생물 데이터베이스
        const creatureDB = [
            {
                id: 'cooksonia',

                reason: '기후 변화와 더 크게 진화한 후속 육상 식물들과의 빛/영양분 경쟁에서 밀려나 멸종했습니다.',

                type: '🐟 고생대~현대 어류',
                name: '실러캔스 (Coelacanth)',
                quote: '"6,600만 년 동안 멸종된 척하는 것도 꽤 고역이었습니다만."',
                era: '고생대 데본기 ~ 현재 (살아있는 화석)',
                size: '몸길이 약 1.5m ~ 2m / 체중 약 80kg',
                trait: '지느러미에 뼈와 근육이 발달한 총지어류(Lobe-finned fish)로, 육상 척추동물(양서류)의 조상과 매우 가깝습니다.',
                detail: '중생대 백악기 말 공룡과 함께 전멸한 것으로 알려졌으나, 1938년 남아프리카 남아프리카 공화국 해안에서 실물이 발견되어 전 세계 과학계를 충격에 빠뜨렸습니다.',
                reason: '얕은 바다 종들은 멸종했으나, 심해 깊은 곳에 적응한 일부 개체군이 현재까지 살아남아 있습니다.',
                img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Latimeria_chalumnae01.jpg/640px-Latimeria_chalumnae01.jpg'
            }
        ];

        // 선택지별 멘트
        const choiceResponses = {
            office: ['대범하군요.', '이건 범죄 아닌가요?', '사무실 비밀 서랍 속에 역사 하나를 은닉했습니다.'],
            return: ['그게 쉽나요?', '행운이군요.', '누군가는 이 결정을 깊이 아쉬워할 것입니다.']
        };

        // 게임 상태 저장
        let gameState = JSON.parse(localStorage.getItem('museum_game_state')) || {
            lastDate: '',
            todayCreature: null,
            museumList: [],
            officeList: []
        };

        // BGM 설정
        document.getElementById('audio-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const audio = document.getElementById('bgm');
                audio.src = URL.createObjectURL(file);
                audio.play();
            }
        });

        window.onload = function() {
            checkDailyVisit();
            renderMuseum();
            renderOffice();
        };

        function checkDailyVisit() {
            const today = new Date().toISOString().slice(0, 10);

            if (gameState.lastDate === today && !gameState.todayCreature) {
                return;
            }

            if (gameState.lastDate !== today) {
                const randomIndex = Math.floor(Math.random() * creatureDB.length);
                gameState.todayCreature = creatureDB[randomIndex];
                gameState.lastDate = today;
                saveState();
            }

            if (gameState.todayCreature) {
                showPopup(gameState.todayCreature);
            }
        }

        function showPopup(creature) {
            const randomHeader = headerTitles[Math.floor(Math.random() * headerTitles.length)];
            const todayStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
            
            document.getElementById('pop-date').innerText = `[ ${todayStr} 의 발견 ]`;
            document.getElementById('pop-header').innerText = randomHeader;
            document.getElementById('pop-quote').innerText = creature.quote;
            document.getElementById('pop-img').src = creature.img;
            
            document.getElementById('pop-info').innerHTML = `
                <div class="info-row"><span class="info-label">🏷️ 학명/명칭:</span> ${creature.name} (${creature.type})</div>
                <div class="info-row"><span class="info-label">⏳ 생존 연대:</span> ${creature.era}</div>
                <div class="info-row"><span class="info-label">📏 신체 규모:</span> ${creature.size}</div>
                <div class="info-row"><span class="info-label">🧬 생물학적 특징:</span> ${creature.trait}</div>
                <div class="info-row"><span class="info-label">📖 고생물학적 가치:</span> ${creature.detail}</div>
                <div class="info-row" style="margin-bottom:0;"><span class="info-label" style="color:#e28181;">☠️ 멸종 원인:</span> ${creature.reason}</div>
            `;

            document.getElementById('daily-modal').classList.remove('hidden');
        }

        function makeChoice(action) {
            const creature = gameState.todayCreature;

            if (action === 'museum') {
                gameState.museumList.push(creature);
                alert(`[${creature.name}]이(가) 중앙 박물관 진열대에 안전하게 배치되었습니다.`);
            } else if (action === 'office') {
                gameState.officeList.push(creature);
                const msg = choiceResponses.office[Math.floor(Math.random() * choiceResponses.office.length)];
                alert(`"${msg}"\n\n[${creature.name}]을(를) 개인 사무실 캐비넷에 은밀히 보관했습니다.`);
            } else if (action === 'return') {
                const msg = choiceResponses.return[Math.floor(Math.random() * choiceResponses.return.length)];
                alert(`"${msg}"\n\n[${creature.name}]을(를) 타 인근 연구기관으로 돌려보냈습니다.`);
            }

            gameState.todayCreature = null;
            saveState();

            document.getElementById('daily-modal').classList.add('hidden');
            renderMuseum();
            renderOffice();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('museum-view').classList.add('hidden');
            document.getElementById('office-view').classList.add('hidden');

            if (tab === 'museum') {
                document.getElementById('museum-view').classList.remove('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('office-view').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        function renderMuseum() {
            const grid = document.getElementById('museum-grid');
            grid.innerHTML = '';

            if (gameState.museumList.length === 0) {
                grid.innerHTML = '<div style="color:#a39284; grid-column: 1/-1; text-align:center; padding: 40px;">전시관이 아직 비어있습니다. 매일 문을 두드리는 생물을 맞이해 보세요.</div>';
                return;
            }

            gameState.museumList.forEach(item => {
                grid.innerHTML += `
                    <div class="museum-stand">
                        <img class="stand-img" src="${item.img}" alt="${item.name}">
                        <div class="stand-caption">
                            <div class="stand-title">${item.name}</div>
                            <div class="stand-subtitle">${item.type}</div>
                            <div class="plaque">${item.era}</div>
                        </div>
                    </div>
                `;
            });
        }

        function renderOffice() {
            const grid = document.getElementById('office-grid');
            grid.innerHTML = '';

            if (gameState.officeList.length === 0) {
                grid.innerHTML = '<div style="color:#8c7a6b; grid-column: 1/-1; text-align:center; padding: 40px;">사무실에 아직 숨겨둔 개인 소장품이 없습니다.</div>';
                return;
            }

            gameState.officeList.forEach(item => {
                grid.innerHTML += `
                    <div class="office-frame">
                        <img class="stand-img" src="${item.img}" alt="${item.name}">
                        <div class="stand-caption">
                            <div class="stand-title" style="color:#e28181;">${item.name}</div>
                            <div class="stand-subtitle" style="color:#b59b9b;">🔒 비공개 개인 수집품</div>
                        </div>
                    </div>
                `;
            });
        }

        function saveState() {
            localStorage.setItem('museum_game_state', JSON.stringify(gameState));
        }
    </script>
</body>
</html>
